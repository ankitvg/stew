name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test
        run: go test ./...

      - name: Build gate
        run: go build ./...

      - name: Build darwin arm64 binary
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist/stew_darwin_arm64
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build \
            -trimpath \
            -ldflags "-s -w -X github.com/ankitvg/stew/internal/version.Version=${VERSION} -X github.com/ankitvg/stew/internal/version.Commit=${COMMIT} -X github.com/ankitvg/stew/internal/version.Date=${BUILD_DATE}" \
            -o dist/stew_darwin_arm64/stew \
            ./cmd/stew

      - name: Package artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tar -C dist/stew_darwin_arm64 -czf "dist/stew_${VERSION}_darwin_arm64.tar.gz" stew
          sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
