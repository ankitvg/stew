name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'

      - name: Test
        run: go test ./...

      - name: Build gate
        run: go build ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          while read -r GOOS GOARCH; do
            OUTDIR="dist/stew_${GOOS}_${GOARCH}"
            mkdir -p "${OUTDIR}"
            GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/ankitvg/stew/internal/version.Version=${VERSION} -X github.com/ankitvg/stew/internal/version.Commit=${COMMIT} -X github.com/ankitvg/stew/internal/version.Date=${BUILD_DATE}" \
              -o "${OUTDIR}/stew" \
              ./cmd/stew
            tar -C "${OUTDIR}" -czf "dist/stew_${VERSION}_${GOOS}_${GOARCH}.tar.gz" stew
          done <<'TARGETS'
          darwin arm64
          darwin amd64
          linux arm64
          linux amd64
          TARGETS
          sha256sum dist/*.tar.gz > dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
